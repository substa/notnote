name: notnote

services:
  notnote:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: "${NOTNOTE_DOCKER_TARGET:-runtime}"
    image: notnote:local
    container_name: notnote
    restart: unless-stopped
    init: true
    user: "${NOTNOTE_UID:-1000}:${NOTNOTE_GID:-1000}"
    ports:
      - "${NOTNOTE_BIND_ADDRESS:-127.0.0.1}:${NOTNOTE_PORT:-4176}:4176"
    expose:
      - "4176"
    volumes:
      - "${NOTNOTE_GRAPH_PATH:?Set NOTNOTE_GRAPH_PATH in .env}:/graph:rw"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
